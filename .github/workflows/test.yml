# pushするたびに、ルールとページのテストを自動で実行します。
# テストが通ったら:
#  - ページ（index.html と firebase-config.js だけ）を GitHub Pages に公開します
#    （Settings → Pages の Source を「GitHub Actions」にしたときだけ。説明書やテストは公開しません）
#  - Firestoreのルールを本番に反映します（FIREBASE_SERVICE_ACCOUNT を登録したときだけ）
name: テスト

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test

  deploy-rules:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
      - name: 鍵が登録されていなければ何もしない
        id: key
        run: |
          if [ -z "$SA" ]; then echo "FIREBASE_SERVICE_ACCOUNT が未登録なので、ルールの自動反映はしません"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v5
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Firestore のルールを反映
        if: steps.key.outputs.ok == 'true'
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13.35.1 deploy --only firestore:rules --project genka-book --config firebase.json --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

  deploy-site:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: 公開するファイルだけを集める
        run: |
          mkdir _site
          cp index.html firebase-config.js _site/
          touch _site/.nojekyll
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
