# pushするたびに、ルールとページのテストを自動で実行します。
# テストが通ったら、ページ（index.html と firebase-config.js だけ）と Firestore のルールを
# Firebase（https://genka-book.web.app）に反映します。FIREBASE_SERVICE_ACCOUNT を登録したときだけ動きます。
name: テスト

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: deploy
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
      - name: 鍵が登録されていなければ何もしない
        id: key
        run: |
          if [ -z "$SA" ]; then echo "FIREBASE_SERVICE_ACCOUNT が未登録なので、反映はしません"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v5
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 22
      - name: 公開するファイルだけを集める
        if: steps.key.outputs.ok == 'true'
        run: |
          mkdir _site
          cp index.html firebase-config.js _site/
          ls -la _site
      - name: ページとルールを反映
        if: steps.key.outputs.ok == 'true'
        run: |
          umask 077
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13.35.1 deploy --only hosting,firestore:rules --project genka-book --config firebase.json --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
