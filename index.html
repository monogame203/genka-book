<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>作品原価帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: sticky top bar with tabs, one 720px column. Each work is a ledger row that ends in a kraft hang-tag price. */
:root{
  --paper:#F1F4F1; --card:#FFFFFF; --soft:#E8EDE9; --line:#D3DAD5;
  --ink:#1B2528; --muted:#5A676B;
  --accent:#1D6B73; --accent-ink:#FFFFFF;
  --tag:#E7D5AD; --tag-ink:#46361A;
  --good:#2A7A4B; --warn:#8F6209; --bad:#B8392B;
  --gold:#A9740A; --gold-soft:#FBF1D9;
  --font-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101517; --card:#182023; --soft:#202A2D; --line:#2B363A;
    --ink:#E5ECE9; --muted:#9AA8AB;
    --accent:#5FBFC8; --accent-ink:#08282B;
    --tag:#3C3325; --tag-ink:#ECDAB3;
    --good:#5CC389; --warn:#E0B04F; --bad:#F08A7C;
    --gold:#F1C14E; --gold-soft:#3A3020;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101517; --card:#182023; --soft:#202A2D; --line:#2B363A;
  --ink:#E5ECE9; --muted:#9AA8AB;
  --accent:#5FBFC8; --accent-ink:#08282B;
  --tag:#3C3325; --tag-ink:#ECDAB3;
  --good:#5CC389; --warn:#E0B04F; --bad:#F08A7C;
  --gold:#F1C14E; --gold-soft:#3A3020;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.35;text-wrap:balance}
p,ul,ol{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,label,.row,a{touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--paper)}
.cdel{width:32px;height:32px;font-size:15px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{max-width:720px;margin-inline:auto;padding:12px 16px 0}
.brandrow{display:flex;align-items:baseline;gap:10px;padding-bottom:6px}
h1{font-size:20px;font-weight:700;letter-spacing:.03em}
.sub{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-inline:-6px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}

.wrap{max-width:720px;margin-inline:auto;padding-inline:16px;padding-block:20px 72px;display:grid;gap:16px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h2{font-size:18px;font-weight:700}
.count{color:var(--muted);font-weight:500;font-size:14px;margin-left:4px}
.lead{color:var(--muted);font-size:14px}

input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.5em .7em;min-height:40px;width:100%;min-width:0}
textarea{resize:vertical;min-height:76px}
input[type=number]{font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools input{flex:1 1 180px}
.tools select{width:auto;flex:0 0 auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:.4em 1em;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:700;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:currentColor}
.btn.sm{min-height:34px;padding:.2em .75em;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:18px;line-height:1}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.rows{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
@media (hover:hover){.row:hover{background:var(--soft)}}
.row:active{background:var(--soft)}
.row.nothumb{grid-template-columns:minmax(0,1fr) auto}
.th{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--soft);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;color:var(--muted);font-size:20px}
img.th{display:block}
.name{background:none;border:0;padding:0;text-align:left;font-weight:700;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--bad)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.badge{font-size:11px;letter-spacing:.04em;padding:.1em .6em;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.badge.pub{color:var(--accent);border-color:var(--accent)}
.badge.warn{color:var(--warn);border-color:var(--warn)}
.stale{font-size:12px;color:var(--warn);margin-top:6px}
.right{text-align:right;display:grid;gap:2px;justify-items:end}
.right .strong{font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums}

.tag{display:inline-flex;align-items:baseline;gap:.3em;background:var(--tag);color:var(--tag-ink);padding:.3em .8em .3em 1.75em;font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;clip-path:polygon(.9em 0,100% 0,100% 100%,.9em 100%,0 50%);-webkit-mask:radial-gradient(circle at .95em 50%,transparent .17em,#000 .18em);mask:radial-gradient(circle at .95em 50%,transparent .17em,#000 .18em)}
.tag.lg{font-size:22px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px}
.panel h3{font-size:15px}
.field{display:grid;gap:4px;min-width:0}
.field>span:first-child{font-size:12px;color:var(--muted);letter-spacing:.04em}
.inp{display:flex;align-items:center;gap:6px}
.inp em{font-style:normal;color:var(--muted);font-size:13px;white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card);width:max-content;max-width:100%}
.seg button{border:0;background:none;padding:.45em .95em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.hint{font-size:13px;color:var(--muted)}
.err{font-size:13px;color:var(--bad)}

.item{display:grid;grid-template-columns:minmax(0,1fr) 88px 34px;gap:8px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.iname{font-weight:700;overflow-wrap:anywhere}
.imeta{font-size:12px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.addrow{display:flex;gap:8px}
.addrow select{flex:1 1 auto}

.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.cell{display:grid;gap:2px;align-content:start}
.cell .k{font-size:12px;color:var(--muted);letter-spacing:.04em}
.cell .v{font-family:var(--font-display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.cell .s{font-size:12px;color:var(--muted)}
.savebar{position:sticky;bottom:0;z-index:15;margin-inline:-16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.savebar b{font-variant-numeric:tabular-nums}

.photo{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photo .th{width:84px;height:84px}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:8px 6px;border-top:1px solid var(--line);font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:500;border-top:0}
th:first-child,td:first-child{text-align:left}
.step{display:inline-flex;align-items:center;gap:6px}
.step output{min-width:2ch;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.shoprow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.shoprow:first-child{border-top:0}

.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:24px 18px;display:grid;gap:10px;justify-items:start}
.empty h2{font-size:17px}

.pubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;align-items:start}
.pub{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid}
.pub .ph{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--soft);display:grid;place-items:center;font-family:var(--font-display);font-size:44px;font-weight:700;color:var(--muted)}
.pb{padding:14px;display:grid;gap:10px}
.pb h3{font-size:16px;overflow-wrap:anywhere}
.pb .note{color:var(--muted);font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.pfoot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:.2em .8em;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.chip svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.chip.on{color:var(--bad);border-color:var(--bad)}
.chip.on svg{fill:currentColor}
.rk{display:inline-flex;align-items:baseline;gap:2px;font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;padding:.05em .75em;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-size:13px}
.rk b{font-size:17px}
.rk.top{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.clist{list-style:none;padding:0;display:grid;gap:10px}
.clist li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:start}
.av{width:24px;height:24px;border-radius:50%;object-fit:cover}
.cname{font-weight:700;font-size:13px}
.when{color:var(--muted);font-size:12px;margin-left:6px}
.ctext{font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.cform{display:flex;gap:8px}
details.panel summary{cursor:pointer;font-weight:700}
details.panel ol{padding-left:1.3em;display:grid;gap:4px;margin-top:10px;font-size:14px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);background:var(--ink);color:var(--paper);padding:.6em 1em;border-radius:10px;font-size:14px;z-index:40}
.banner{background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;font-size:14px;display:grid;gap:4px}
.banner b{font-family:var(--font-display)}
.clist li.hid .ctext{color:var(--muted)}
.hidnote{display:inline-block;font-size:11px;color:var(--warn);border:1px solid var(--warn);border-radius:99px;padding:0 .6em;margin-left:6px;vertical-align:1px}
.rep{background:none;border:0;padding:0;margin-top:2px;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.rep[disabled]{text-decoration:none;cursor:default}
.mrow{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0;padding-top:0}
.mrow .ctext{background:var(--soft);border-radius:8px;padding:8px 10px}
.why{font-size:12px;color:var(--warn)}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:auto;min-height:0}
.rule{border:1px solid var(--warn);background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.7;display:grid;gap:2px}
.rule b{color:var(--warn);font-size:14px}
/* gallery: sub pages, super like, bottom nav */
.gnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.gnav button{flex:0 0 auto;min-height:40px;padding:.35em 1.05em;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:700}
.gnav button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.gnav .n{font-weight:500;font-variant-numeric:tabular-nums;margin-left:2px}
.quota{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.quota .stars{display:inline-flex;gap:3px;color:var(--gold)}
.quota .stars svg{width:18px;height:18px}
.quota .stars .off{color:var(--line)}
.quota .grow{flex:1 1 auto;min-width:0}
.sguide{display:grid;gap:10px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;font-size:14px}
.sguide .sh{display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:0;padding:0;width:100%;text-align:left;font-weight:700;color:var(--ink);min-height:32px}
.sguide .sh span{display:inline-flex;align-items:center;gap:6px}
.sguide .sh svg{width:18px;height:18px;color:var(--gold);fill:currentColor}
.sguide .sh i{font-style:normal;font-weight:500;font-size:13px;color:var(--muted)}
.sguide ol{margin:0;padding-left:1.4em;display:grid;gap:6px;line-height:1.6}
.sguide .demo{display:inline-flex;align-items:center;gap:4px;padding:0 .6em;border-radius:99px;border:1px solid var(--gold);color:var(--gold);font-size:12px;font-weight:700;vertical-align:1px;white-space:nowrap}
.sguide .demo svg{width:12px;height:12px;fill:currentColor}
.chip.sup.on,.chip.sup.arm{color:var(--gold);border-color:var(--gold)}
.chip.sup.on svg{fill:currentColor}
.chip.sup.arm{background:var(--gold-soft);font-weight:700}
.chip[disabled]{opacity:.45;cursor:default}
.fresh{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.newb{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:0 .45em}
.mine-tag{font-size:12px;color:var(--gold);font-weight:700}
.feedhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.bnav{display:none}
@media (max-width:640px){
  .top .tabs{display:none}
  .brandrow{padding-bottom:10px}
  .bnav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:4px 4px env(safe-area-inset-bottom,0px)}
  .bnav button{display:grid;justify-items:center;gap:2px;min-height:54px;padding:6px 2px;background:none;border:0;color:var(--muted);font-size:11px;font-weight:500}
  .bnav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bnav button[aria-selected="true"]{color:var(--accent);font-weight:700}
  .bnav .dot{position:relative}
  .bnav .dot b{position:absolute;top:-4px;right:-10px;min-width:16px;height:16px;border-radius:99px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;padding:0 4px}
  body.has-bnav .wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  body.has-bnav .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .pubgrid{grid-template-columns:minmax(0,1fr)}
  .chip{min-height:40px;padding-inline:.95em}
  .pb{padding:12px 14px 14px}
}
/* phone: 16px inputs (no iOS focus zoom), 44px tap targets, stacked shop table */
@media (max-width:640px){
  body{font-size:15px}
  .bar{padding:10px 16px 0}
  h1{font-size:18px}
  input,select,textarea{font-size:16px;min-height:44px}
  .btn{min-height:44px}
  .btn.sm{min-height:40px;padding-inline:.9em}
  .iconbtn{width:44px;height:44px}
  .cdel{width:40px;height:40px}
  .seg button{min-height:44px;padding-inline:1em}
  .seg{width:100%}
  .seg button{flex:1 1 auto}
  .head .btn.primary{flex:0 0 auto}
  .tools input{flex:1 1 100%}
  .tools select{flex:1 1 0;width:auto}
  .row{grid-template-columns:48px minmax(0,1fr) auto;gap:10px;padding:12px}
  .th{width:48px;height:48px;font-size:18px}
  .photo .th{width:72px;height:72px}
  .item{grid-template-columns:minmax(0,1fr) 76px 44px}
  .addrow .btn{flex:0 0 auto}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .sum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cell .v{font-size:19px}
  .tag.lg{font-size:19px}
  .savebar .actions{flex:1 1 100%}
  .savebar .actions .btn{flex:1 1 0}
  .rep{padding:6px 0;font-size:13px}
  .linkbtn{padding:4px 0}
  .cform .btn{min-height:44px}
  .actions .btn{flex:1 1 auto}
  .step{gap:4px}
  .scroll{overflow:visible}
  table.stack{min-width:0}
  table.stack thead{display:none}
  table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
  table.stack tr{padding:10px 0;border-top:1px solid var(--line)}
  table.stack tr:first-child{border-top:0}
  table.stack td{border:0;padding:2px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
  table.stack td::before{content:attr(data-label);color:var(--muted);font-size:12px;text-align:left;flex:0 0 auto}
  table.stack td:first-child{font-weight:700;text-align:left;overflow-wrap:anywhere}
  table.stack td:first-child::before{content:none}
  /* hide the bottom menu while the keyboard is up */
  body.typing .bnav{display:none}
}
@media (prefers-reduced-motion:no-preference){.pub.arrive{animation:arrive .5s ease-out}@keyframes arrive{from{opacity:0;transform:translateY(-8px)}}}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,6px)}}}
</style>

<div id="app"></div>

<script>
(function(){
'use strict';

/* CALC-START */
function unitPrice(p){var q=Number(p&&p.qty);if(!(q>0))q=1;return (Number(p&&p.price)||0)/q;}
function costOf(w,byId){var parts=0,missing=0;(w.items||[]).forEach(function(it){var p=byId[it.partId];if(!p){missing++;return;}parts+=unitPrice(p)*(Number(it.qty)||0);});var extra=Number(w.extra)||0;return {parts:parts,extra:extra,total:parts+extra,missing:missing};}
function roundUp(v,step){step=Number(step)||1;if(step<=1)return Math.max(0,Math.ceil(v-1e-9));return Math.max(0,Math.ceil(v/step-1e-9)*step);}
function priceOf(w,cost){
  var fee=(Number(w.fee)||0)/100,price=0;
  if(w.mode==='manual'){return {price:Number(w.manualPrice)||0};}

  works.forEach(function(w){var n=Number(w.makeQty)||0;if(n<=0)return;var c=calcWork(w,byId);count+=n;sales+=c.price*n;profit+=c.profit*n;(w.items||[]).forEach(function(it){need[it.partId]=(need[it.partId]||0)+(Number(it.qty)||0)*n;});});

  Object.keys(need).forEach(function(id){var p=byId[id];if(!p||!(need[id]>0))return;var q=Number(p.qty)>0?Number(p.qty):1,packs=Math.ceil(need[id]/q-1e-9),cost=packs*(Number(p.price)||0);lines.push({part:p,need:need[id],packs:packs,pack:q,buy:cost,use:need[id]*unitPrice(p)});buy+=cost;use+=need[id]*unitPrice(p);});

}

  var f={likes:function(r){return r.likes;},comments:function(r){return r.comments;},super:function(r){return r.supers;}}[mode]||function(r){return r.total;};

/* Built-in words. Matched after normalizing width/case and removing spaces and symbols (so "死 ね" or "ｷﾓｲ" still match).
   Kana forms are listed separately on purpose: folding カナ→かな would turn ordinary words (ばかり, カスタム) into hits. */
var BASE_WORDS=['死ね','氏ね','シネ','タヒね','しねよ','しんでくれ','死んでくれ','死んでしまえ','死んでください','しんでしまえ','しんでください','おまえしね','おまいしね','あんたしね','お前しね','ふざけんな','ふざけるな','殺す','ころす','コロス','消えろ','きえろ','キエロ','失せろ','うせろ',
  'きもい','キモい','キモイ','きしょい','キショい','キショイ','気持ち悪い','きもちわるい','キモすぎ','うざい','ウザい','ウザイ','うぜー','ウゼー',
  'ぶさいく','ブサイク','不細工','ブス','ばーか','バーカ','馬鹿','バカ','ばか','アホ','阿呆','クソ','クズ','ゴミ','ごみ作品','ださい','ダサい','ダサイ',
  '下手くそ','下手糞','へたくそ','ヘタクソ','ぼったくり','ボッタクリ','詐欺','パクリ','低能','無能','ガイジ','池沼','ゴミクズ',
  'ちんこ','まんこ','ちんちん','おっぱい','セックス','fuck','shit','bitch','idiot','stupid','ugly','kys','killyourself'];
/* Ordinary words that contain a listed word; removed before matching. */
var ALLOW=['バカンス','カスタム','ゴミ箱','ごみ箱','ゴミ袋','ごみ袋','アホウドリ','あほうどり','ぶすっと','パクリと','バカ売れ','ばか売れ','ばかり','ばかげ','ばかでか','ばかうけ','ばかばかしい','そばかす','シネマ','シネコン','ブスッ'];
function norm(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[\s　・･.,、。，．!！?？…‥~〜～_\-*＊\/|｜"'“”‘’「」『』()（）\[\]【】]/g,'');}
var NORM_ALLOW=ALLOW.map(norm),wordCache={key:'',list:[]};
function wordList(){
  var extra=(S.mod.words||[]),key=extra.join('\n');
  if(wordCache.key!==key||!wordCache.list.length){wordCache.key=key;wordCache.list=BASE_WORDS.concat(extra).map(norm).filter(function(w){return w.length>0;});}
  return wordCache.list;

/* Returns the matched word, or '' */
function ngHit(text){
  var t=norm(text);NORM_ALLOW.forEach(function(a){if(a)t=t.split(a).join('');});
  var L=wordList();for(var i=0;i<L.length;i++){if(t.indexOf(L[i])>=0)return L[i];}
  var LEAD=['しね','あほ','くそ'];
  for(var j=0;j<LEAD.length;j++){if(new RegExp('(?:^|[^ぁ-ん])'+LEAD[j]).test(t))return LEAD[j];}
  return '';
}
function spamHit(text){
  var s=String(text||'');
  if(/https?:\/\/|www\.|\.(com|net|jp|io|xyz|info)\b/i.test(s))return 'リンクは書き込めません';
  if(/(.)\1{9,}/.test(s))return '同じ文字の連続は書き込めません';
  if(/(?:\d[\s\-ー－]?){10,}/.test(s.normalize('NFKC')))return '電話番号のような情報は書き込めません';
  if(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/.test(s))return 'メールアドレスは書き込めません';
  return '';
}

var CODE_PREFIX='GENKA1.';
function submitPanel(b){
  return '<section class="panel"><h3>公開ページに載せる</h3>'+
    '<p class="hint">公開ページへの掲載は、このページの作成者が確認してから行います。「投稿コードを作る」を押して、できたコードをSNSやメッセージで作成者に送ってください。載るのは作品名・説明・販売価格・作者名だけで、原価やパーツの情報、写真は含まれません。</p>'+
    '<label class="field" for="nick"><span>作者名（公開ページに表示されます）</span><input id="nick" data-bind="nick" value="'+esc(S.nick)+'" maxlength="30" placeholder="例：mina_beads"></label>'+
    '<div class="actions"><button class="btn primary" data-act="make-code">投稿コードを作る</button></div>'+
    (S.code?'<label class="field" for="code-out"><span>投稿コード</span><textarea id="code-out" readonly rows="3">'+esc(S.code)+'</textarea></label><div class="actions"><button class="btn" data-act="copy-code">コードをコピー</button></div>':'')+
    '</section>';
}
function b64enc(str){return btoa(unescape(encodeURIComponent(str)));}
function b64dec(str){return decodeURIComponent(escape(atob(str)));}
function makeCode(){
  var b=S.editing;if(!b)return;
  var name=b.name.trim(),note=b.note.trim(),nick=String(S.nick||'').trim();
  if(!name)return toast('作品名を入力してください');
  if(!nick)return toast('作者名を入力してください');
  if(ngHit(name+' '+note+' '+nick))return toast('作品名・説明・作者名に不適切な言葉が含まれているため、コードを作れません');
  var sp=spamHit(note);if(sp)return toast(sp);
  var c=calcWork(docFrom(b),S.D.byId);
  if(c.err)return toast(c.err);
  if(!(c.price>0))return toast('販売価格が0円のため、コードを作れません');
  lsSet(LS_NICK,nick);
  var payload={v:1,k:Date.now().toString(36)+Math.random().toString(36).slice(2,8),n:name.slice(0,60),d:note.slice(0,400),p:Math.round(c.price),a:nick.slice(0,30),t:Date.now()};
  S.code=CODE_PREFIX+b64enc(JSON.stringify(payload));sched();
  toast('投稿コードを作りました。コピーして作成者に送ってください');
}
function parseCode(raw){
  var t=String(raw||'').replace(/\s+/g,'');
  var i=t.indexOf(CODE_PREFIX);if(i<0)return {err:'投稿コードが見つかりません。「GENKA1.」から始まるコードを貼り付けてください。'};
  var o;try{o=JSON.parse(b64dec(t.slice(i+CODE_PREFIX.length)));}catch(e){return {err:'コードが途中で切れているか、壊れています。もう一度コピーしてもらってください。'};}
  if(!o||o.v!==1||typeof o.n!=='string'||typeof o.a!=='string'||!/^[a-z0-9]{6,30}$/.test(String(o.k||''))||!(Number(o.p)>=0&&Number(o.p)<=10000000))return {err:'このコードは読み込めません。'};
  return {w:{k:o.k,name:o.n.trim().slice(0,60),note:String(o.d||'').trim().slice(0,400),price:Math.round(Number(o.p)),by:o.a.trim().slice(0,30)}};
}

      return ref.set({works:works}).then(function(){return !!prev;});

function readPhoto(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){var img=new Image();img.onload=function(){
      var k=Math.min(1,560/Math.max(img.width,img.height)),cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(img.width*k));cv.height=Math.max(1,Math.round(img.height*k));
      var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
      var q=.72,out=cv.toDataURL('image/jpeg',q);while(out.length>170000&&q>.35){q-=.1;out=cv.toDataURL('image/jpeg',q);}
      res(out);};img.onerror=function(){rej(new Error('image'));};img.src=fr.result;};
    fr.onerror=function(){rej(new Error('read'));};fr.readAsDataURL(file);
  });
}

/* ---------- likes & super likes ----------
   One record per person: {works:{key:ts}, supers:{key:count}, superAt:{key:ts}, day, used, extra}.
   Team members keep it in likes/<id>; everyone else keeps it in this browser. */
var LS_LIKES='genka-likes-v1',AD_MAX=5;
function obj(v){return (v&&typeof v==='object'&&!Array.isArray(v))?v:{};}
function normRec(v){v=obj(v);return {works:Object.assign({},obj(v.works)),supers:Object.assign({},obj(v.supers)),superAt:Object.assign({},obj(v.superAt)),day:typeof v.day==='string'?v.day:'',used:Number(v.used)||0,extra:Number(v.extra)||0};}
function myRec(){return S.myRec||(S.myRec=normRec(S.local?null:(S.uid&&S.likes[S.uid]?{works:S.likes[S.uid]}:null)));}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function roll(r){if(r.day!==today()){r.day=today();r.used=0;r.extra=0;}return r;}
function superLeft(){var r=roll(normRec(myRec()));return Math.max(0,1+r.extra-r.used);}
function usedToday(){var r=roll(normRec(myRec()));return r.used;}
function extraToday(){var r=roll(normRec(myRec()));return r.extra;}
function adBridge(){try{var g=window.GenkaApp;return (g&&typeof g.showRewardedAd==='function')?g:null;}catch(e){return null;}}
function applyRec(r){S.myRec=r;if(S.uid){S.likes[S.uid]=r.works;S.supers[S.uid]=r.supers;}sched();}
function loadLocalRec(){var v=null;try{v=JSON.parse(lsGet(LS_LIKES)||'null');}catch(e){}S.myRec=normRec(v);if(S.uid){S.likes[S.uid]=S.myRec.works;S.supers[S.uid]=S.myRec.supers;}}
/* fn edits a record in place and returns false to cancel; it runs on the local copy, then again on the stored copy. */
function updateRec(fn){
  var next=normRec(myRec());if(fn(next)===false)return Promise.resolve(false);
  applyRec(next);
  if(S.local){lsSet(LS_LIKES,JSON.stringify(next));return Promise.resolve(true);}
  var uid=S.uid;
  return enqueue('l',function(){
    var ref=S.db.doc('likes/'+uid);
    return ref.get().then(function(d){var cur=normRec(d.exists&&d.data());if(fn(cur)===false)return false;if(S.fbMode)cur.g=true;return ref.set(cur).then(function(){return true;});});
  }).catch(function(e){toast(failMsg(e));return false;});
}

  var on=!myRec().works[wid],at=Date.now();

function superLike(wid){
  if(!S.uid)return toast('スーパーいいねするにはログインが必要です');
  if(needGoogle())return toast('スーパーいいねは、Googleでログインした人だけが送れます。上の「Googleでログイン」を押してください');
  var s=S.showcase[wid];if(!s)return;
  if(s.owner===S.uid)return toast('自分の作品にはスーパーいいねできません');
  if(superLeft()<=0){S.confirm='';sched();return toast(adBridge()&&extraToday()<AD_MAX?'今日の分は使い切りました。広告を見るともう1回できます':'今日のスーパーいいねは使い切りました。明日また使えます');}
  if(S.confirm!=='s:'+wid){S.confirm='s:'+wid;sched();toast('もう一度★を押すとスーパーいいねを送ります（今日の残り'+superLeft()+'回）');clearTimeout(S.armT);S.armT=setTimeout(function(){if(S.confirm==='s:'+wid){S.confirm='';sched();}},4000);return;}
  S.confirm='';var at=Date.now();
  updateRec(function(r){roll(r);if(1+r.extra-r.used<=0)return false;r.used++;r.supers[wid]=(Number(r.supers[wid])||0)+1;r.superAt[wid]=at;if(!r.works[wid])r.works[wid]=at;})
    .then(function(ok){if(ok){toast('スーパーいいねを送りました。今日の残り'+superLeft()+'回');if(S.sguideOpen){S.sguideOpen=false;lsSet(LS_SG,'1');sched();}}});

function postComment(wid){
  var text=String(S.drafts[wid]||'').trim();if(!text||S.checking[wid])return;
  if(!S.uid)return toast('コメントするにはログインが必要です');
  if(S.readOnly)return toast('閲覧のみのため、コメントはできません');

  if(S.fbMode){var ne=ensureName();if(ne)return toast(ne);}
  var uid=S.uid;
  if((S.comments[uid]||[]).length>=COMMENT_CAP)return toast('コメントの上限（'+COMMENT_CAP+'件）に達しました。古いコメントを削除してください');
  if(ngHit(text))return toast('悪口や不適切な言葉が含まれているため、投稿できません。表現を変えてください');
  var sp=spamHit(text);if(sp)return toast(sp);

function commitComment(uid,wid,text){
  var local=(S.comments[uid]||[]).slice();
  var c={id:newId('c'),workId:wid,text:text.slice(0,300),at:Date.now()};
  local.push(c);S.drafts[wid]='';S.comments[uid]=local;sched();
  mutateComments(uid,function(cur){if(cur.some(function(x){return x.id===c.id;}))return null;if(cur.length>=COMMENT_CAP)return null;cur.push(c);return cur;})
    .catch(function(e){toast(failMsg(e));resync('comments',uid,'items',S.comments);});
}
function deleteComment(uid,cid){
  S.comments[uid]=(S.comments[uid]||[]).filter(function(c){return c.id!==cid;});sched();
  mutateComments(uid,function(cur){return cur.filter(function(c){return c.id!==cid;});})
    .catch(function(e){toast(failMsg(e));resync('comments',uid,'items',S.comments);});
}
var COMMENT_CAP=150;
function mutateComments(uid,fn){
  return enqueue('c:'+uid,function(){
    var ref=S.db.doc('comments/'+uid);

      var cur=((d.exists&&(d.data()||{}).items)||[]).slice(),next=fn(cur);

  'mod-th':function(t){var m=modCopy();m.threshold=Number(t.dataset.v)||3;saveMod(m);},
  'mod-words':function(){var el=document.getElementById('mod-words');if(!el)return;var m=modCopy();
    m.words=el.value.split(/[\n,、]/).map(function(w){return w.trim();}).filter(function(w,i,a){return w&&w.length<=30&&a.indexOf(w)===i;}).slice(0,300);
    saveMod(m).then(function(){toast('NGワードを保存しました（'+m.words.length+'件）');});},
  seed:function(){seed();},
  'fb-login':function(){googleLogin();},
  'fb-logout':function(){if(S.confirm!=='logout'){S.confirm='logout';toast('もう一度押すとログアウトします');sched();return;}S.confirm='';S.fb.auth.signOut().then(function(){location.reload();});},
  'clear-seed':function(){var ids=S.items.filter(function(x){return x.sample;}).map(function(x){return x.id;});
    Promise.all(ids.map(removeDoc)).then(function(){toast('サンプルを削除しました');}).catch(function(e){toast(failMsg(e));});}
};
root.addEventListener('click',function(e){

function onBind(e){

  var k=t.dataset&&t.dataset.bind;if(!k)return;

  if(k==='draft'){S.drafts[t.dataset.id]=v;return;}

/* Hide the bottom menu while typing; bring it back a moment later so a tap on a button (which blurs the field) isn't caught by the menu. */

/* ---------- boot ---------- */
function loadNames(){
  if(!S.user)return;
  var all={};Object.keys(S.comments).forEach(function(u){all[u]=1;});Object.keys(S.showRaw).forEach(function(u){all[u]=1;});
  var need=Object.keys(all).filter(function(u){return u!=='guest'&&!(u in S.names);});
  if(!need.length)return;
  need.forEach(function(u){S.names[u]='';});
  S.user.profiles(need).then(function(ps){need.forEach(function(u){var p=ps[u];S.names[u]=p&&p.name||'';S.avatars[u]=p&&p.avatarUrl||'';});sched();}).catch(function(){});
}
function listen(ref,onData){
  ref.onSnapshot(function(snap){onData(snap);sched();},function(){S.offline=!S.ready?true:S.offline;sched();});
}
async function boot(){
  render();
  try{
    var use=window.claude&&window.claude.use;
    if(!use){
      var cfg=await loadConfig();
      if(cfg){try{await bootFirebase(cfg);return;}catch(e){S.db=null;S.user=null;S.uid=null;S.fbMode=false;S.fb=null;toast('みんなの作品に接続できませんでした。この端末に保存するモードで開きます');}}
      S.noShared=true;enterLocal();S.tab='works';S.ready=true;sched();return;
    }
    var res=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    S.db=res[0];S.user=res[1];
    if(!S.db){S.noShared=true;enterLocal();S.tab='works';S.ready=true;sched();return;}
    if(S.user){
      S.uid=await S.user.id();S.owner=await S.user.isOwner();
      var cw=null;try{cw=await S.user.can('data.write');}catch(e){}
      S.readOnly=!S.owner&&cw===false;
    }
    window.claude.use('sample').then(function(f){S.sample=f||null;},function(){});
    if(S.readOnly||!S.uid)enterLocal();
    S.tab=(S.local&&!S.items.length)?'gallery':'works';
    S.ready=true;sched();
    startListeners();
  }catch(e){if(!S.ready){S.noShared=!S.db;enterLocal();S.tab='works';S.ready=true;}sched();}
}
function startListeners(){
    listen(S.db.collection('showcase'),function(snap){var raw={},flat={};snap.docs.forEach(function(d){var ws=(d.data()||{}).works||{};raw[d.id]=ws;Object.keys(ws).forEach(function(wid){var o=Object.assign({},ws[wid]);o.owner=d.id;o.wid=wid;flat[showKey(d.id,wid)]=o;});});S.showRaw=raw;S.showcase=flat;loadNames();});
    listen(S.db.collection('likes'),function(snap){
      var m={},sp={};snap.docs.forEach(function(d){var v=d.data()||{};if(S.fbMode&&v.g!==true)return;m[d.id]=obj(v.works);sp[d.id]=obj(v.supers);if(!S.local&&d.id===S.uid)S.myRec=normRec(v);});
      S.likes=m;S.supers=sp;
      if(S.local&&S.uid){var r=myRec();S.likes[S.uid]=r.works;S.supers[S.uid]=r.supers;}
    });
    listen(S.db.collection('comments'),function(snap){var m={};snap.docs.forEach(function(d){m[d.id]=(d.data()||{}).items||[];});S.comments=m;loadNames();});
    listen(S.db.collection('reports'),function(snap){var m={};snap.docs.forEach(function(d){m[d.id]=(d.data()||{}).items||{};});S.reports=m;});
    listen(S.db.doc('mod/settings'),function(d){var v=(d&&d.exists&&d.data())||{};
      S.mod={words:Array.isArray(v.words)?v.words.filter(function(w){return typeof w==='string';}):[],ai:v.ai!==false,threshold:Number(v.threshold)||3,
        blocked:(v.blocked&&typeof v.blocked==='object')?v.blocked:{},cleared:(v.cleared&&typeof v.cleared==='object')?v.cleared:{}};wordCache.key='\u0000';});
    if(S.uid&&!S.readOnly){listen(myCol(),function(snap){if(S.local)return;S.items=snap.docs.map(function(d){var o=Object.assign({},d.data()||{});o.id=d.id;return o;});});}
}

/* ---------- Firebase (the GitHub-hosted page) ----------
   Outside Claude the page reads firebase-config.js next to it. With a Firebase project set there,
   everyone who opens the link signs in as a guest (anonymous auth) and can register works, publish, like and comment.
   The Firestore paths are the same as inside Claude; firestore.rules enforces who may write where. */
var FB_BASE='https://www.gstatic.com/firebasejs/10.12.2/';
function loadScript(src){return new Promise(function(res,rej){var el=document.createElement('script');el.src=src;el.onload=function(){res();};el.onerror=function(){rej(new Error('load '+src));};document.head.appendChild(el);});}
function loadConfig(){return loadScript('firebase-config.js').then(function(){var c=window.GENKA_CONFIG;return (c&&c.firebase&&c.firebase.apiKey)?c:null;},function(){return null;});}
async function bootFirebase(cfg){
  await loadScript(FB_BASE+'firebase-app-compat.js');
  await Promise.all([loadScript(FB_BASE+'firebase-auth-compat.js'),loadScript(FB_BASE+'firebase-firestore-compat.js')]);
  firebase.initializeApp(cfg.firebase);
  var auth=firebase.auth(),fs=firebase.firestore();
  try{fs.settings({ignoreUndefinedProperties:true});}catch(e){}
  try{await auth.getRedirectResult();}catch(e){if(e&&e.code==='auth/credential-already-in-use'&&e.credential){try{await auth.signInWithCredential(e.credential);}catch(x){}}}
  var u=await new Promise(function(res){var off=auth.onAuthStateChanged(function(x){off();res(x);});});
  if(!u)u=(await auth.signInAnonymously()).user;
  var owners=(cfg.ownerEmails||[]).map(function(e){return String(e).trim().toLowerCase();});
  S.fb={auth:auth};S.fbMode=true;S.db=fs;S.user=fbUser(fs);
  S.uid=u.uid;S.owner=!!(u.email&&u.emailVerified&&owners.indexOf(u.email.toLowerCase())>=0);S.readOnly=false;
  try{var pd=await fs.doc('profiles/'+u.uid).get();S.profileName=(pd.exists&&(pd.data()||{}).name)||'';}catch(e){S.profileName='';}
  S.nick=S.profileName||lsGet(LS_NICK)||'';
  S.tab='works';S.ready=true;sched();
  startListeners();
}
/* Gemini through Firebase AI Logic (free Gemini Developer API). Loaded on first use as ES modules,
   on its own named app so it doesn't touch the compat app above. Tries each model in turn. */
var FB_AI_BASE='https://www.gstatic.com/firebasejs/11.9.1/';
var aiModels=null;
function aiLoad(){
  if(aiModels)return aiModels;
  var cfg=window.GENKA_CONFIG||{},names=(cfg.aiModels&&cfg.aiModels.length)?cfg.aiModels:['gemini-2.5-flash-lite','gemini-2.5-flash','gemini-2.0-flash'];
  aiModels=Promise.all([import(FB_AI_BASE+'firebase-app.js'),import(FB_AI_BASE+'firebase-ai.js')]).then(function(m){
    var app=m[0].initializeApp(cfg.firebase,'genka-ai'),ai=m[1].getAI(app,{backend:new m[1].GoogleAIBackend()});
    return names.map(function(n){return m[1].getGenerativeModel(ai,{model:n,generationConfig:{responseMimeType:'application/json',temperature:0}});});
  });
  aiModels.catch(function(){aiModels=null;});
  return aiModels;
}
function geminiJson(prompt){
  return aiLoad().then(function(list){
    var i=0;
    function next(err){
      if(i>=list.length)return Promise.reject(err||new Error('ai'));
      var m=list[i++];
      return m.generateContent(prompt).then(function(r){
        var t=String(r.response.text()||'').replace(/^\s*```(?:json)?|```\s*$/g,'').trim();
        return JSON.parse(t);
      },function(e){var msg=String(e&&e.message||'');if(/404|not.?found|is not supported|deprecated/i.test(msg))return next(e);throw e;});
    }
    return next();
  });
}
function fbUser(fs){
  var cache={};
  function one(id){
    if(!cache[id])cache[id]=fs.doc('profiles/'+id).get().then(function(d){var v=(d.exists&&d.data())||{};return {name:typeof v.name==='string'?v.name.slice(0,30):'',avatarUrl:''};},function(){delete cache[id];return {name:'',avatarUrl:''};});
    return cache[id];
  }
  return {profiles:function(ids){return Promise.all(ids.map(one)).then(function(list){var o={};ids.forEach(function(id,i){o[id]=list[i];});return o;});}};
}
/* Checks the display name and stores it once it changes. Returns an error message or ''. */
function ensureName(){
  var n=String(S.nick||'').trim();
  if(!n)return '表示する名前を入力してください';
  if(ngHit(n))return '名前に不適切な言葉が含まれています';
  if(n!==S.profileName){S.profileName=n;S.names[S.uid]=n;lsSet(LS_NICK,n);S.db.doc('profiles/'+S.uid).set({name:n.slice(0,30)}).catch(function(e){toast(failMsg(e));});}
  return '';
}
function nameField(id){
  return '<label class="field" for="'+id+'"><span>表示する名前（みんなの作品に出ます）</span><input id="'+id+'" data-bind="nick" value="'+esc(S.nick)+'" maxlength="30" placeholder="例：mina_beads"></label>';
}
function googleLogin(){
  var auth=S.fb.auth,p=new firebase.auth.GoogleAuthProvider(),u=auth.currentUser,anon=u&&u.isAnonymous;
  (anon?u.linkWithPopup(p):auth.signInWithPopup(p)).catch(function(e){
    if(e&&e.code==='auth/credential-already-in-use'&&e.credential)return auth.signInWithCredential(e.credential);
    if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'))return anon?u.linkWithRedirect(p):auth.signInWithRedirect(p);
    throw e;
  }).then(function(){location.reload();},function(e){if(e&&(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request'))return;toast(e&&/disallowed|web-storage|operation-not-supported/i.test(String(e.code||'')+String(e.message||''))?'このアプリの中ではGoogleにログインできません。SafariやChromeで開き直してください':'ログインできませんでした。時間をおいてお試しください');});
}
function accountPanel(){
  if(!S.fbMode||!S.fb)return '';
  var u=S.fb.auth.currentUser;if(!u)return '';
  if(u.isAnonymous)return '<section class="panel"><h3>アカウント</h3><p class="hint">今はゲストとして、このブラウザで使っています。Googleでログインすると、ほかのスマホやパソコンでも同じ帳簿・いいね・コメントが使えます。</p><div class="actions"><button class="btn" data-act="fb-login">Googleでログイン</button></div></section>';
  return '<section class="panel"><h3>アカウント</h3><p class="hint">'+esc(u.email||'Googleアカウント')+' でログイン中'+(S.owner?'（作成者）':'')+'</p><div class="actions"><button class="btn" data-act="fb-logout">ログアウト</button></div></section>';
}
boot();
})();
